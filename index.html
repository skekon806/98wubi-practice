<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>五笔98练习</title>
<style>
@font-face {
  font-family: zgFont;
  src: url('98WB-0.otf') format('opentype');
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif, zgFont;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px 16px;
  overflow-x: hidden;
}
.container {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,.1);
  padding: 32px 40px;
  text-align: center;
  width: 560px;
  max-width: 100%;
  position: relative;
}

/* ---- hamburger ---- */
.hamburger {
  position: absolute; top: 14px; left: 14px;
  width: 40px; height: 40px;
  border: 1px solid #e2e5ea; border-radius: 10px;
  background: #fff; cursor: pointer;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center; gap: 4px;
  z-index: 20;
}
.hamburger span { display: block; width: 18px; height: 2px; background: #666; border-radius: 1px; }
.menu {
  position: absolute; top: 62px; left: 14px;
  background: #fff; border: 1px solid #e2e5ea;
  border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
  width: 220px; padding: 6px; z-index: 30;
  display: none;
}
.menu.open { display: block; }
.menu-item {
  padding: 10px 12px; border-radius: 8px; cursor: pointer;
  font-size: 14px; color: #333;
}
.menu-item:hover { background: #f5f7ff; }
.menu-item.active { background: #eef1ff; color: #4f6cf7; font-weight: bold; }
.menu-item .sub { font-size: 11px; color: #aaa; }
.menu-divider { height: 1px; background: #eee; margin: 6px 4px; }
.menu-action {
  padding: 10px 12px; border-radius: 8px; cursor: pointer;
  font-size: 13px; color: #dc2626;
}
.menu-action:hover { background: #fef2f2; }
.mode-title { font-size: 15px; color: #555; margin-bottom: 4px; }

.char-display { font-size: 110px; line-height: 1.2; margin: 12px 0; min-height: 132px; user-select: none; }
.char-display.root-char {
  font-family: zgFont, "Microsoft YaHei", sans-serif;
  font-size: 120px;
  min-height: 144px;
}
.top-bar { display: flex; justify-content: space-between; align-items: center;
  color: #888; font-size: 14px; margin-bottom: 8px;
}
.stats { display: flex; gap: 16px; }
.badge {
  font-size: 12px; background: #e8eaed; padding: 2px 10px;
  border-radius: 10px; color: #555;
}
.code-inputs { display: flex; justify-content: center; gap: 12px; margin: 16px 0; }
.code-inputs input {
  width: 56px; height: 64px;
  font-size: 32px; text-align: center;
  border: 2px solid #d0d5dd; border-radius: 10px; outline: none;
  text-transform: uppercase; font-family: "Consolas", monospace;
  caret-color: #4f6cf7;
}
.code-inputs input.single { width: 72px; height: 72px; font-size: 36px; }
.code-inputs input:focus { border-color: #4f6cf7; box-shadow: 0 0 0 3px rgba(79,108,247,.15); }
.code-inputs input.filled { border-color: #4f6cf7; background: #f5f7ff; }
.code-inputs input.correct { border-color: #16a34a; background: #f0fdf4; }
.code-inputs input.wrong { border-color: #dc2626; background: #fef2f2; }
.feedback { margin-top: 16px; padding: 14px; border-radius: 10px; display: none; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.feedback.wrong { display: block; background: #fef2f2; border: 1px solid #fca5a5; }
.feedback .full-code { font-size: 12px; color: #999; }
.feedback .key-hint { font-size: 28px; font-weight: bold; color: #4f6cf7; }
.feedback .region-tag {
  display: inline-block; font-size: 12px; padding: 2px 10px;
  border-radius: 10px; background: #e8eaed; color: #555; margin-top: 4px;
}
.root-chars { display: flex; justify-content: center; gap: 8px; margin: 10px 0; }
.root-chars span {
  font-family: zgFont, "Microsoft YaHei", sans-serif;
  font-size: 52px; line-height: 1;
  padding: 8px 12px;
  border: 1px solid #e2e5ea; border-radius: 8px;
  background: #fafbfc;
  display: inline-block;
}
.hint-text { font-size: 14px; color: #888; }
.schedule-info { font-size: 12px; color: #aaa; margin-top: 10px; line-height: 1.6; }

/* ---- 视图切换 ---- */
.view-switch {
  display: flex; justify-content: center; gap: 10px; margin-bottom: 16px;
}
.vs-btn {
  padding: 6px 28px; border-radius: 999px;
  border: 1px solid #d0d5dd; background: #fff; color: #666;
  font-size: 14px; cursor: pointer;
}
.vs-btn.active { background: #4f6cf7; border-color: #4f6cf7; color: #fff; font-weight: bold; }

/* ---- 反查 ---- */
.lookup-panel { display: none; }
.lookup-input {
  width: 100%; padding: 12px; font-size: 24px; text-align: center;
  border: 2px solid #d0d5dd; border-radius: 10px; outline: none;
  font-family: inherit; margin-bottom: 14px;
}
.lookup-input:focus { border-color: #4f6cf7; box-shadow: 0 0 0 3px rgba(79,108,247,.15); }
.lookup-hint { color: #888; font-size: 14px; padding: 36px 0; }
.lookup-item {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  background: #fafbfc; border: 1px solid #e2e5ea; border-radius: 10px;
  padding: 10px 16px; margin-bottom: 8px;
}
.li-char { font-size: 44px; line-height: 1; width: 52px; text-align: center; flex-shrink: 0; }
.li-code {
  font-size: 22px; font-family: "Consolas", monospace; color: #4f6cf7;
  font-weight: bold; letter-spacing: 2px; flex-shrink: 0;
}
.li-split { display: flex; flex-wrap: wrap; gap: 4px; }
.ls-glyph { font-family: zgFont, "Microsoft YaHei", sans-serif; font-size: 32px; line-height: 1; }
.li-missing { color: #999; font-size: 14px; }

/* ---- 移动端适配 ---- */
@media (max-width: 520px) {
  body { padding: 0; }
  .container {
    width: 100%;
    border-radius: 0;
    box-shadow: none;
    padding: 18px 14px calc(28px + env(safe-area-inset-bottom));
    min-height: 100vh;
    min-height: 100dvh;
  }
  .hamburger { top: 12px; left: 12px; width: 44px; height: 44px; }
  .menu { top: 62px; left: 12px; width: 210px; }
  .menu-item, .menu-action { -webkit-tap-highlight-color: transparent; }
  .mode-title { font-size: 14px; }
  .top-bar { font-size: 13px; gap: 6px; flex-wrap: wrap; }
  .stats { gap: 10px; }
  .char-display { font-size: 84px; margin: 8px 0; min-height: 101px; }
  .char-display.root-char { font-size: 88px; min-height: 106px; }
  .code-inputs { gap: 8px; margin: 14px 0; }
  .code-inputs input { width: 46px; height: 54px; font-size: 26px; }
  .code-inputs input.single { width: 60px; height: 60px; font-size: 30px; }
  .feedback { margin-top: 12px; padding: 12px; }
  .feedback .key-hint { font-size: 24px; }
  .root-chars span { font-size: 40px; padding: 6px 9px; }
  .schedule-info { font-size: 11px; }
  .view-switch { margin-bottom: 12px; }
  .vs-btn { padding: 6px 22px; }
  .lookup-item { gap: 12px; padding: 8px 10px; }
  .li-char { font-size: 36px; width: 44px; }
  .li-code { font-size: 18px; }
  .ls-glyph { font-size: 26px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="hamburger" id="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  <div class="menu" id="menu"></div>

  <div class="view-switch">
    <button class="vs-btn active" id="vsPractice" onclick="switchView('practice')">练习</button>
    <button class="vs-btn" id="vsLookup" onclick="switchView('lookup')">反查</button>
  </div>

  <div id="practicePanel">
    <div class="mode-title" id="modeTitle"></div>
    <div class="top-bar">
      <span id="progress">0 / 0</span>
      <div class="stats">
        <span>正确 <strong id="correctCount">0</strong></span>
        <span>错误 <strong id="wrongCount">0</strong></span>
        <span class="badge" id="reviewBadge">待复习: 0</span>
      </div>
    </div>
    <div id="charDisplay" class="char-display" style="display:none"></div>
    <div class="hint-text" id="hintText"></div>
    <div class="code-inputs" id="codeInputs"></div>
    <div class="feedback" id="feedback"></div>
    <div class="schedule-info">
      复习曲线（艾宾浩斯，1组=5题）：每字答对后按 2组→5组→10组→20组→40组→80组 间隔复习，答错重置为 2组。<br>答对的新字也会进入复习；新字练完后自动进入复习阶段。进度自动保存在本机
    </div>
  </div>

  <div class="lookup-panel" id="lookupPanel">
    <input class="lookup-input" id="lookupInput" type="text" maxlength="8"
           placeholder="输入汉字，实时反查编码与拆解"
           autocomplete="off" autocapitalize="off" spellcheck="false" oninput="lookupChar()">
    <div class="lookup-result" id="lookupResult"></div>
  </div>
</div>

<script>window.WUBI_DATA = {};</script>
<script src="data/decomp.js"></script>
<script src="data/code.js"></script>
<script src="data/encode1.js"></script>
<script src="data/encode2.js"></script>
<script src="data/encode3.js"></script>
<script src="data/jm1.js"></script>
<script src="data/jm2.js"></script>
<script src="data/root.js"></script>
<script src="app.js"></script>
</body>
</html>
